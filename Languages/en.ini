[OptionExplanations]
OptionExplanations=Description of the options.
HV_BGAnimIntensity=Controls how intense background animations are. Off disables them entirely.
HV_Parallax=Toggle mouse-driven parallax movement on certain screens.
HV_AccentColor=Choose a primary accent color for the theme's UI elements.
HV_BackgroundEffect=Choose a visual style for the main menu background.
HV_ShowMSD=Change between the StepMania classic display mode and the modern Etterna MSD.
HV_ErrorBarMode=Choose the display mode for the timing error bar: Standard (scatter plot), EWMA (moving average), or Both.
HV_ErrorBarColoringMode=Choose whether the error bar dots are colored based on J4 (standard) cutoffs or the current judge's strictness.
HV_ShowProfileStats=Toggle display of your profile statistics on the song selection screen.
HV_MSDColorScaleV3=Choose between Holographic Void, Classic (Til Death), None (White), Monochrome, or Accent Color MSD color schemes.
HV_ShowMeasureLines=Toggle display of horizontal measure divider lines in gameplay.
HV_ScreenFilter=Dim the background/playfield to improve visibility of notes.
HV_LaneCoverSudden=Adjust the height of the Sudden Lane Cover (spawn area).
HV_LaneCoverHidden=Adjust the height of the Hidden Lane Cover (receptor area).
HV_ShowNPS=Toggle real-time display of Notes Per Second (NPS) counter in gameplay.
HV_Particles=Toggle background and menu decoration particles.
HV_EnableGlow=Toggle subtle glow effects on active and focused elements.
HV_UseCustomGrades=Toggle usage of custom Kanji grade names.
HV_GradeColorStyle=Toggle between Holographic, Classic, or Custom grade text coloring. Custom allows you to define individual colors for each grade.
HV_JudgmentColorStyle=Toggle between Holographic, Classic, or Custom judgment text coloring.
HV_DifficultyColorStyle=Toggle between Holographic, Classic, or Custom difficulty meter coloring.
HV_ClearTypeColorStyle=Toggle between Holographic, Classic, or Custom clear type coloring.
HV_GoalTrackerColorStyle=Toggle between Holographic, Classic, or Custom goal tracker coloring.
HV_NPSWindowSize=Set the time window (in seconds) used for the real-time NPS calculation.
HV_ShowPacemakerGraph=Show the full-size pacemaker graph at the top of the screen.
HV_ShowGoalTracker=Show the mini text-based Goal Tracker.
HV_PacemakerTargetType=Select the type of target to compare against.
HV_PacemakerTargetGoal=Set the target percentage to use for the pacemaker comparison.
HV_PacemakerType=Quickly toggle between different pacemaker targets.
HV_PacemakerGoal=Adjust the target percentage for the current session.
HV_ShowMean=Toggle display of the average timing offset (Mean) on the notefield during gameplay.
HV_QuotesMode=Choose what text to scroll on the title screen: Quotes, Tips, or hide it entirely.
HV_EmulateRidiculous=Pseudo-adds the Ridiculous judgement window (Half of Marvelous) with a special indicator.
Mini=Adjust the zoom level of the receptors and notes. 100% is normal size.
HV_ShowJudgment=Toggle the display of judgment text (Marvelous, Perfect, etc) during gameplay.
HV_ShowCombo=Toggle the display of the combo counter during gameplay.
HV_ShowCurrentWife=Toggle the display of the current Wife% score during gameplay.
HV_ShowJudgeCounter=Toggle the display of the judgment tally (W1/W2/W3 counts) during gameplay.
HV_ShowPlayerInfo=Toggle the display of player information (name, avatar) during gameplay.
HV_ProgressBarPosition=Set the position of the song progress bar: Top, Bottom, or Off.
HV_ShowInGameLeaderboard=Show a leaderboard during gameplay. Local shows your stored scores, Online shows the EtternaOnline chart leaderboard.
HV_ShowNPSGraph=Toggle the display of the NPS graph during gameplay.
HV_ComboBreakHighlight=Toggle lane highlighting when a combo break occurs.
HV_AssistMode=Enable assist clap to help with timing.
HV_GoalTrackerText=Toggle the display of the text-based Goal Tracker during gameplay.
HV_SongPreview=Select the song preview behavior. SM Style is the default engine behavior. osu! New loops from preview point to end. osu! Old plays once from preview point then loops from start.
HV_MinimalisticMode=Disables most HUD elements except for the notefield for a cleaner experience. Just you and the notefield.
HV_JudgeCounterMode=Choose between Full (all judgments and metrics) or Simple (only tap judgments) tally display.
HV_ShowNGIndicator=Toggle the "NG" popup indicator when dropping a Hold/Roll.
HV_InstantSearch=If On, the search query is updated as you type. If Off, the query is only confirmed when pressing Enter.
HV_PrioritizeLowerJudgements=Display lower judgments on screen for a longer duration than higher judgments.
HV_DisplayLowerJudgementOffset=Show the signed hit offset in milliseconds for judgments at or below the selected threshold. Misses are never shown.
HV_OffsetDisplayJudgement=Select the highest judgement that is allowed to show the lower judgement hit offset text.
HV_JudgmentAnimation=Toggle a subtle bounce and glow animation when a note is hit.
HV_ComboAnimation=Toggle a bounce and glow animation for the combo counter.
HV_RecentJudgmentDisplay=Show a vertical line of colored dots on the left of the notefield representing hit history (max 20).
HV_SongBackgroundBrightness=Adjust the opacity/brightness of the song background display. 0% (Off) disables the display.
HV_ScoreDisplayMode=Select how the main Wife% score is displayed: Normal (accumulative) or Subtractive (starts at 100% and drops based on lost points).
HV_AutoFailMode=Automatically fail or restart the song if you drop below a specified Wife% or hit too many of a specific judgement.
HV_AutoFailCondition=Choose whether the fail/restart trigger checks a specific Wife% threshold, a judgment limit, or your current Personal Best score.
HV_AutoFailJudgement=Select which judgement type to monitor for the Judgement Limit condition.
HV_AutoFailThreshold_Wife=Set the granular Wife% threshold. Falling below this exact value will trigger the selected action.
HV_AutoFailThreshold_Count=Set the maximum allowed count for the selected judgement. Hitting this many will trigger the action.
